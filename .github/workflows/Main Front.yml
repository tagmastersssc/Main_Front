
name: Main Front - Deploy app to Azure

on:
  push:
    branches: [ "prod","uat" ]

env:
  APP_LOCATION: "/"
  APP_ARTIFACT_LOCATION: "dist"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: "${{github.ref_name}}"
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Azure CLI script
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo VITE_LOGIN_URL=$(az keyvault secret show --vault-name main${{github.ref_name}}-eastus2 --name VITE-LOGIN-URL --query value -o tsv) >> $GITHUB_ENV
          echo VITE_WHATSAPP_URL=$(az keyvault secret show --vault-name main${{github.ref_name}}-eastus2 --name VITE-WHATSAPP-URL --query value -o tsv) >> $GITHUB_ENV
          echo VITE_CONTACT_EMAIL=$(az keyvault secret show --vault-name main${{github.ref_name}}-eastus2 --name VITE-CONTACT-EMAIL --query value -o tsv) >> $GITHUB_ENV
          echo VITE_GA_MEASUREMENT_ID=$(az keyvault secret show --vault-name main${{github.ref_name}}-eastus2 --name VITE-GA-MEASUREMENT-ID --query value -o tsv) >> $GITHUB_ENV


    - name: Build And Deploy
      id: builddeploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: ${{ env.APP_LOCATION }}
        app_artifact_location: ${{ env.APP_ARTIFACT_LOCATION }}
      env:
        VITE_LOGIN_URL: ${{ env.VITE_LOGIN_URL }}
        VITE_WHATSAPP_URL: ${{ env.VITE_WHATSAPP_URL }}
        VITE_CONTACT_EMAIL: ${{ env.VITE_CONTACT_EMAIL }}
        VITE_GA_MEASUREMENT_ID: ${{ env.VITE_GA_MEASUREMENT_ID }}

